# Include these directives inside the website's `server {}` block.
# Keep the existing aaPanel PHP include / FastCGI configuration.

# Deployment scripts and private release/source directories are never public files.
# Place before generic PHP/static regex locations in the aaPanel server block.
location ^~ /deploy/ {
    return 404;
}
location ~ ^/whatsapp/(?:\.deploy|current|build|storage|node_modules|tmp|\.env)(?:/|$|\.) {
    return 404;
}

# OAuth discovery for MCP endpoints hosted in bundle subfolders.
location = /account/.well-known/oauth-protected-resource {
    rewrite ^ /account/index.php/.well-known/oauth-protected-resource last;
}
location = /account/.well-known/oauth-protected-resource/mcp {
    rewrite ^ /account/index.php/.well-known/oauth-protected-resource/mcp last;
}
location = /account/.well-known/oauth-authorization-server {
    rewrite ^ /account/index.php/.well-known/oauth-authorization-server last;
}
location = /account/.well-known/openid-configuration {
    rewrite ^ /account/index.php/.well-known/openid-configuration last;
}

location = /store/.well-known/oauth-protected-resource {
    rewrite ^ /store/index.php/.well-known/oauth-protected-resource last;
}
location = /store/.well-known/oauth-protected-resource/mcp {
    rewrite ^ /store/index.php/.well-known/oauth-protected-resource/mcp last;
}
location = /store/.well-known/oauth-authorization-server {
    rewrite ^ /store/index.php/.well-known/oauth-authorization-server last;
}
location = /store/.well-known/openid-configuration {
    rewrite ^ /store/index.php/.well-known/openid-configuration last;
}

location = /material/.well-known/oauth-protected-resource {
    rewrite ^ /material/index.php/.well-known/oauth-protected-resource last;
}
location = /material/.well-known/oauth-protected-resource/mcp {
    rewrite ^ /material/index.php/.well-known/oauth-protected-resource/mcp last;
}
location = /material/.well-known/oauth-authorization-server {
    rewrite ^ /material/index.php/.well-known/oauth-authorization-server last;
}
location = /material/.well-known/openid-configuration {
    rewrite ^ /material/index.php/.well-known/openid-configuration last;
}

location = /invoice/.well-known/oauth-protected-resource {
    rewrite ^ /invoice/index.php/.well-known/oauth-protected-resource last;
}
location = /invoice/.well-known/oauth-protected-resource/mcp {
    rewrite ^ /invoice/index.php/.well-known/oauth-protected-resource/mcp last;
}
location = /invoice/.well-known/oauth-authorization-server {
    rewrite ^ /invoice/index.php/.well-known/oauth-authorization-server last;
}
location = /invoice/.well-known/openid-configuration {
    rewrite ^ /invoice/index.php/.well-known/openid-configuration last;
}

location = /fit/.well-known/oauth-protected-resource {
    rewrite ^ /fit/index.php/.well-known/oauth-protected-resource last;
}
location = /fit/.well-known/oauth-protected-resource/mcp {
    rewrite ^ /fit/index.php/.well-known/oauth-protected-resource/mcp last;
}
location = /fit/.well-known/oauth-authorization-server {
    rewrite ^ /fit/index.php/.well-known/oauth-authorization-server last;
}
location = /fit/.well-known/openid-configuration {
    rewrite ^ /fit/index.php/.well-known/openid-configuration last;
}

# RFC 9728 and RFC 8414 fallback paths for issuers that contain a path.
location = /.well-known/oauth-protected-resource/account/mcp {
    return 302 /account/.well-known/oauth-protected-resource/mcp;
}
location = /.well-known/oauth-authorization-server/account {
    return 302 /account/.well-known/oauth-authorization-server;
}
location = /.well-known/openid-configuration/account {
    return 302 /account/.well-known/openid-configuration;
}

location = /.well-known/oauth-protected-resource/store/mcp {
    return 302 /store/.well-known/oauth-protected-resource/mcp;
}
location = /.well-known/oauth-authorization-server/store {
    return 302 /store/.well-known/oauth-authorization-server;
}
location = /.well-known/openid-configuration/store {
    return 302 /store/.well-known/openid-configuration;
}

location = /.well-known/oauth-protected-resource/material/mcp {
    return 302 /material/.well-known/oauth-protected-resource/mcp;
}
location = /.well-known/oauth-authorization-server/material {
    return 302 /material/.well-known/oauth-authorization-server;
}
location = /.well-known/openid-configuration/material {
    return 302 /material/.well-known/openid-configuration;
}

location = /.well-known/oauth-protected-resource/invoice/mcp {
    return 302 /invoice/.well-known/oauth-protected-resource/mcp;
}
location = /.well-known/oauth-authorization-server/invoice {
    return 302 /invoice/.well-known/oauth-authorization-server;
}
location = /.well-known/openid-configuration/invoice {
    return 302 /invoice/.well-known/openid-configuration;
}

location = /.well-known/oauth-protected-resource/fit/mcp {
    return 302 /fit/.well-known/oauth-protected-resource/mcp;
}
location = /.well-known/oauth-authorization-server/fit {
    return 302 /fit/.well-known/oauth-authorization-server;
}
location = /.well-known/openid-configuration/fit {
    return 302 /fit/.well-known/openid-configuration;
}

location /account/ {
    try_files $uri $uri/ /account/index.php?$query_string;
}

location /store/ {
    try_files $uri $uri/ /store/index.php?$query_string;
}

location /material/ {
    try_files $uri $uri/ /material/index.php?$query_string;
}

location /invoice/ {
    try_files $uri $uri/ /invoice/index.php?$query_string;
}

location /fit/ {
    try_files $uri $uri/ /fit/index.php?$query_string;
}

# OAuth codes must not be written to the access log. Route through authenticated WEB,
# never proxy directly to the CLI listener on 3334. Block 3334 from external access.
location ^~ /whatsapp/oauth/mcp/callback/ {
    access_log off;
    add_header Referrer-Policy no-referrer always;
    proxy_pass http://127.0.0.1:3333/oauth/mcp/callback/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /whatsapp;
}

location /whatsapp/ {
    proxy_pass http://127.0.0.1:3333/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /whatsapp;
}

location ~ ^/(account|store|material|invoice)/(application|system|tests|docs)(/|$) {
    return 404;
}

location ~ ^/fit/(application|src|tests)(/|$) {
    return 404;
}

location ~ ^/store/storage/.*\.(?:php|phtml|phar|cgi|pl|py|sh)$ {
    return 404;
}

location ~ ^/(account|store|material|invoice|fit|whatsapp)/(composer\.(json|lock)|package(-lock)?\.json|.*\.(md|rst)|\.env.*)$ {
    return 404;
}
